name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic version tag such as v1.0.0; got: $TAG_NAME" >&2
            exit 1
          fi

      - name: Show toolchain
        run: xcodebuild -version

      - name: Run offline checks
        run: |
          ./scripts/check-browse-jump.sh
          ./scripts/check-workshop-api.sh

      - name: Build unsigned release package
        run: ./scripts/build-unsigned.sh

      - name: Verify release package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          release_assets=(dist/WallpaperBrowser-*.zip)
          if (( ${#release_assets[@]} != 1 )); then
            echo "Expected exactly one release zip in dist/." >&2
            printf '%s\n' "${release_assets[@]}" >&2
            exit 1
          fi

          archive_dir="$RUNNER_TEMP/release-check"
          mkdir -p "$archive_dir"
          unzip -q "${release_assets[0]}" -d "$archive_dir"

          app_binary="$archive_dir/wallpaper-browser.app/Contents/MacOS/wallpaper-browser"
          app_icon="$archive_dir/wallpaper-browser.app/Contents/Resources/AppIcon.icns"
          architectures="$(lipo -archs "$app_binary")"
          if [[ " $architectures " != *" arm64 "* || " $architectures " != *" x86_64 "* ]]; then
            echo "Expected a Universal app; found architectures: $architectures" >&2
            exit 1
          fi
          if [[ ! -f "$app_icon" ]]; then
            echo "Expected the application icon at $app_icon" >&2
            exit 1
          fi

          unzip -t "${release_assets[0]}"
          echo "path=${release_assets[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          ASSET_PATH: ${{ steps.package.outputs.path }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$ASSET_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG_NAME" "$ASSET_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Wallpaper Browser $TAG_NAME" \
              --generate-notes
          fi
